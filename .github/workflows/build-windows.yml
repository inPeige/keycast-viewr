name: Build Windows EXE

# 触发方式：手动点击运行，或推送到 main 分支时自动运行
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest   # 使用 GitHub 提供的 Windows 服务器
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: pyinstaller --noconfirm keycast.spec

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyCastViewer-windows
          path: dist/KeyCastViewer.exe
